# Minimal Alp daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change ALP_PASSWORD first.
services:
  alp:
    image: ghcr.io/getpaseo/paseo:latest
    container_name: alp
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      ALP_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # ALP_HOSTNAMES: "alp.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./alp-home:/home/alp
      # Code visible to Alp and the agents it launches.
      - ./workspace:/workspace
