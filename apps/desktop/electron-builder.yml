# Packaging of the macOS desktop shell (t-81b0.3, docs/alp/desktop.md §6): two DMGs, arm64 and x64,
# ad-hoc signed (no Apple Developer ID, no notarization), nothing published.
appId: com.anhlp.alp.shell
productName: ALP # the bundle is ALP.app: `alp desktop` looks for that name
copyright: ALP
directories:
  output: release
  buildResources: build
# The app has no runtime dependency: dist/ is the bundled main process and its pages.
files:
  - dist/**
  - package.json
asar: true
npmRebuild: false
publish: null
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: '-' # ad-hoc: an unsigned Apple Silicon build is reported as damaged
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '12.0'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  writeUpdateInfo: false
