# Alternative to the Caddyfile (docs/alp/remote-gateway.md §7): nginx terminates TLS and forwards
# to the gateway on loopback. Keep Host, set X-Forwarded-For/-Proto, pass the WebSocket upgrade.
# Do not add $http_sec_websocket_protocol or $http_authorization to any log_format.
server {
    listen 443 ssl;
    http2 off;
    server_name alp.example.com;
    ssl_certificate     /etc/letsencrypt/live/alp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alp.example.com/privkey.pem;

    location ~ ^/(v1/tickets|v1/ws|healthz|readyz)$ {
        proxy_pass http://127.0.0.1:7434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location / { return 404; }
}
