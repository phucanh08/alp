name = "alp-website"
# account_id: set CLOUDFLARE_ACCOUNT_ID env or fill in your own
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = "./src/server-entry.ts"

routes = [
  { pattern = "alp.anhlp.com", custom_domain = true },
  { pattern = "www.alp.anhlp.com", custom_domain = true },
]

[observability]
enabled = true

[[kv_namespaces]]
binding = "WEBSITE_CACHE"
id = "<your KV namespace id>"
