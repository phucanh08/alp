name: Check committed terminal native helpers
description: Require the committed six-slot matrix (terminal-native.yml already checked the Linux slots against a fresh build of this revision).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        ls -l packages/daemon/native/prebuilt/*/terminal-owner
        node scripts/terminal-native-assets.mjs --require-matrix
        git diff --exit-code -- packages/daemon/native/prebuilt
