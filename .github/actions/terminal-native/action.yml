name: Stage terminal native helpers
description: Stage the four Linux helpers built by terminal-native.yml for this run, then require the full matrix.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: terminal-native-*
        path: ${{ runner.temp }}/terminal-native
        merge-multiple: true
    - shell: bash
      run: |
        for archive in "$RUNNER_TEMP"/terminal-native/*.tar; do tar -C packages/daemon/native/prebuilt -xf "$archive"; done
        ls -l packages/daemon/native/prebuilt/*/terminal-owner
        node scripts/terminal-native-assets.mjs --require-matrix
