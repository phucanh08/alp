name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate:core

  paseo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Plugin-owned and all cross-package tests use fake providers.
      - run: npm run validate:paseo

  # H2 (docs/alp/beta-scope.md §6.1, D7): macOS is the primary test platform, so the core and paseo
  # lanes run there too, on a runner with no global ALP install. A new job name: the required checks
  # core (22/24) and paseo (22/24) keep theirs.
  core-paseo-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:core
      - run: npm run validate:paseo

  windows-daemon:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/build-workspace.mjs paseo
      # The CLI discovery fixture creates a Unix symlink; all daemon lifecycle/session tests run.
      - run: node --test packages/client/tests/daemon-paths.test.js packages/daemon/tests/daemon.test.js packages/daemon/tests/ipc-security.test.js integrations/paseo/tests/daemon-git.test.js

  # The standalone browser app (apps/web, docs/alp/web.md): types, unit tests, the bundle's SDK-only
  # boundary, then Playwright against a real gateway and alpd with a fake provider on random ports.
  alp-web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - run: npm run validate:web
        env:
          ALP_WEB_PLAYWRIGHT_OUTPUT: ${{ runner.temp }}/alp-web-playwright
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alp-web-playwright-${{ matrix.os }}
          path: ${{ runner.temp }}/alp-web-playwright
          retention-days: 7
          if-no-files-found: ignore

  # The ALP web app (ALPD §62): Paseo's app at the pinned commit with ALP's patches, built and opened in Chrome.
  packages-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm's cache for ALP's own install and the Paseo monorepo's, which changes only with the pinned commit.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-app-${{ hashFiles('package-lock.json', 'paseo-web/upstream.json') }}
          restore-keys: npm-web-app-
      - run: npm ci
      # Builds the pinned web app and all packages before inspecting/installing tarballs.
      - run: npm run validate:packages
      - run: node scripts/web-app-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: alp-web-app
          path: dist/web-app
          retention-days: 14
          if-no-files-found: error
