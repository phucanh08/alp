name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The four Linux terminal-owner helpers, built from this revision and staged by every Linux lane.
  terminal-native:
    uses: ./.github/workflows/terminal-native.yml

  # The self-contained executable on four native runners, smoked with and without Node (t-1e02).
  binary:
    uses: ./.github/workflows/binary-build.yml

  core:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      - run: npm run validate:core

  paseo:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      # Plugin-owned and all cross-package tests use fake providers.
      - run: npm run validate:paseo

  # The paseo lane above builds and tests with the SDK in the lockfile, the newest supported Paseo.
  # This one runs it against the lowest release requirements.paseo admits, so both bounds of the
  # supported range are tested (t-e5dc). The newest published release: .github/workflows/paseo-compat.yml.
  paseo-sdk-floor:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      - run: node scripts/use-paseo-sdk.mjs floor
      - run: npm ci
      - run: node scripts/use-paseo-sdk.mjs --verify
      - run: npm run validate:paseo

  # H2 (docs/alp/beta-scope.md §6.1, D7): macOS is the primary test platform, so the core and paseo
  # lanes run there too, on a runner with no global ALP install. A new job name: the required checks
  # core (22/24) and paseo (22/24) keep theirs.
  core-paseo-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:core
      - run: npm run validate:paseo

  windows-daemon:
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/build-workspace.mjs cli
      - run: node scripts/build-workspace.mjs paseo
      # t-fa1b: run the catalog/compact/probe/migration regressions on both Windows Node versions.
      - run: node scripts/run-tests.mjs --private-home packages/daemon/tests/model-catalog.test.js packages/runtime/tests/model-catalog.test.js packages/runtime/tests/compact.test.js packages/runtime/tests/antigravity-mode.test.js packages/client/tests/acp-probe.test.js packages/core/tests/providers.test.js test/integration/paseo-source-check-tar.test.js
      # Select recovery/CLI regressions without the older Unix-symlink library fixtures.
      - run: >-
          node -e "import('./scripts/test-lib.mjs').then(({runNodeTests})=>{process.exitCode=runNodeTests(['packages/core/tests/library-edit.test.js','packages/cli/tests/library.test.js'],{privateHome:true,extra:['--test-name-pattern=retired metadata IO|own role key|AFTER moving|retired text lists']})})"
      # Every test step runs through runNodeTests with --private-home (t-bfbd): a throwaway ALP_HOME,
      # TMPDIR and HOME/USERPROFILE, without ALP_*_BIN or the caller's ALP session variables.
      # The CLI discovery fixture creates a Unix symlink; all daemon lifecycle/session tests run.
      - run: node scripts/run-tests.mjs --private-home packages/client/tests/daemon-paths.test.js packages/daemon/tests/daemon.test.js packages/daemon/tests/ipc-security.test.js integrations/paseo/tests/daemon-git.test.js test/integration/test-env.test.js packages/client/tests/lock-fstat.test.js packages/client/tests/start-integration.test.js
      # workspace.git over real repositories, including a real untracked junction (t-8f37); the POSIX shell-trap tests skip on win32.
      - run: node scripts/run-tests.mjs --private-home packages/daemon/tests/git.test.js
      # The win32 terminal owner: unit tests, then a real cmd.exe through node-pty/ConPTY (the "ConPTY:" tests run only here).
      - run: node scripts/run-tests.mjs --private-home packages/daemon/tests/windows-terminal.test.js
      - run: node scripts/test-package.mjs gateway --private-home
      - run: node scripts/run-tests.mjs --private-home packages/cli/tests/alp-dashboard.test.js
      # npm install -g of the packed wrapper into a throwaway prefix: npm's alp.cmd runs, and alpd is found through it (t-1f14).
      - run: node scripts/npm-wrapper-smoke.mjs

  # The standalone browser app (apps/web, docs/alp/dashboard.md): types, unit tests, the bundle's SDK-only
  # boundary, then Playwright against a real gateway and alpd with a fake provider on random ports.
  alp-web:
    needs: terminal-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        uses: ./.github/actions/terminal-native
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - run: npm run validate:web
        env:
          ALP_WEB_PLAYWRIGHT_OUTPUT: ${{ runner.temp }}/alp-web-playwright
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-web-playwright-${{ matrix.os }}
          path: ${{ runner.temp }}/alp-web-playwright
          retention-days: 7
          if-no-files-found: ignore

  # The eight packages: built, packed once like a release (a rehearsal), checked, installed and
  # exercised by the consumer checks, including Paseo's own plugin compiler on the plugin (#111).
  # The job keeps its name, a required check: it built and smoked Paseo's web app (paseo-web)
  # until that app was removed (t-55ce.3).
  packages-and-web:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      # Checks out the pinned Paseo compiler and builds all packages before inspecting/installing tarballs.
      - run: npm run validate:packages

  # The macOS desktop shell (apps/desktop, D32): a standalone bun project outside the npm workspaces,
  # so the root runner never sees its tests. Unit tests, typecheck, the bundle, then the Electron e2e
  # against a disposable alp dashboard host built from this checkout (packages/cli/dist/alp-dashboard.js), with
  # Playwright's _electron from the root install. Then the two ad-hoc signed DMGs (arm64, x64; t-81b0.3,
  # docs/alp/desktop.md §6), each tested as installed (e2e/packaged.spec.mjs; x64 under Rosetta) and
  # kept as a workflow artifact. Nothing is published.
  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test test
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: node scripts/build-workspace.mjs cli
        working-directory: .
      - run: bun run e2e
      # electron-builder skips code signing on pull-request builds unless CSC_FOR_PULL_REQUEST is set.
      # Its concern is a certificate from the keychain or secrets reaching a fork's PR; this build
      # signs ad-hoc (identity '-') with no certificate, secret or keychain, so it signs as on main.
      # Tripwire: the day this job gets a certificate or a secret (CSC_LINK, Apple notarization
      # credentials), remove CSC_FOR_PULL_REQUEST, or a fork's PR code could sign with them.
      - run: bun run dist
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ls -l release/*.dmg
      # The DMG name carries package.json's version: ALP-<version>-<arch>.dmg.
      - run: ALP_DESKTOP_DMG="$(ls release/ALP-*-arm64.dmg)" bun run e2e:packaged
      # The x64 app runs under Rosetta on the arm64 runner; install it when the image lacks it.
      - run: arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
      - run: ALP_DESKTOP_DMG="$(ls release/ALP-*-x64.dmg)" bun run e2e:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-desktop-macos-arm64-dmg
          path: apps/desktop/release/ALP-*-arm64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-desktop-macos-x64-dmg
          path: apps/desktop/release/ALP-*-x64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
