name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The four Linux terminal-owner helpers, built from this revision and staged by every Linux lane.
  terminal-native:
    uses: ./.github/workflows/terminal-native.yml

  # The self-contained executable on four native runners, smoked with and without Node (t-1e02).
  binary:
    uses: ./.github/workflows/binary-build.yml

  core:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      - run: npm run validate:core

  paseo:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      # Plugin-owned and all cross-package tests use fake providers.
      - run: npm run validate:paseo

  # The paseo lane above builds and tests with the SDK in the lockfile, the newest supported Paseo.
  # This one runs it against the lowest release requirements.paseo admits, so both bounds of the
  # supported range are tested (t-e5dc). The newest published release: .github/workflows/paseo-compat.yml.
  paseo-sdk-floor:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      - run: node scripts/use-paseo-sdk.mjs floor
      - run: npm ci
      - run: node scripts/use-paseo-sdk.mjs --verify
      - run: npm run validate:paseo

  # H2 (docs/alp/beta-scope.md §6.1, D7): macOS is the primary test platform, so the core and paseo
  # lanes run there too, on a runner with no global ALP install. A new job name: the required checks
  # core (22/24) and paseo (22/24) keep theirs.
  core-paseo-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:core
      - run: npm run validate:paseo

  windows-daemon:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/build-workspace.mjs cli
      - run: node scripts/build-workspace.mjs paseo
      # The CLI discovery fixture creates a Unix symlink; all daemon lifecycle/session tests run.
      - run: node --test packages/client/tests/daemon-paths.test.js packages/daemon/tests/daemon.test.js packages/daemon/tests/ipc-security.test.js integrations/paseo/tests/daemon-git.test.js
      # The win32 terminal owner: unit tests, then a real cmd.exe through node-pty/ConPTY (the "ConPTY:" tests run only here).
      - run: node --test packages/daemon/tests/windows-terminal.test.js
      - run: npm test --workspace @anhlp/alp-gateway
      - run: node --test packages/cli/tests/alp-web.test.js
      # npm install -g of the packed wrapper into a throwaway prefix: npm's alp.cmd runs, and alpd is found through it (t-1f14).
      - run: node scripts/npm-wrapper-smoke.mjs

  # The standalone browser app (apps/web, docs/alp/web.md): types, unit tests, the bundle's SDK-only
  # boundary, then Playwright against a real gateway and alpd with a fake provider on random ports.
  alp-web:
    needs: terminal-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        uses: ./.github/actions/terminal-native
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - run: npm run validate:web
        env:
          ALP_WEB_PLAYWRIGHT_OUTPUT: ${{ runner.temp }}/alp-web-playwright
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-web-playwright-${{ matrix.os }}
          path: ${{ runner.temp }}/alp-web-playwright
          retention-days: 7
          if-no-files-found: ignore

  # The eight packages: built, packed once like a release (a rehearsal), checked, installed and
  # exercised by the consumer checks, including Paseo's own plugin compiler on the plugin (#111).
  # The job keeps its name, a required check: it built and smoked Paseo's web app (paseo-web)
  # until that app was removed (t-55ce.3).
  packages-and-web:
    needs: terminal-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/terminal-native
      # Checks out the pinned Paseo compiler and builds all packages before inspecting/installing tarballs.
      - run: npm run validate:packages
