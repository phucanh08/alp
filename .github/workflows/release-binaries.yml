# Binary release (t-1807, docs/alp/binary-install.md): builds and smokes the ALP bundle for
# darwin-arm64, darwin-x64, linux-x64, linux-arm64 and windows-x64 (.zip, P2) at the given SHA on main (binary-build.yml),
# then writes SHA256SUMS, attests build provenance for every archive, and creates or refreshes a
# DRAFT (non-prerelease) GitHub release v<version> with the archives, SHA256SUMS and install.sh. It never publishes:
# the owner reviews the draft and publishes it by hand (which is when the tag is created).
# From 0.0.1-beta.10 (t-81b0.10) the draft also carries the macOS desktop app built from the same SHA:
# ALP-<version>-arm64.dmg and ALP-<version>-x64.dmg (ad-hoc signed, not notarized; docs/alp/desktop.md §6),
# with their own checksum file DESKTOP-SHA256SUMS and build-provenance attestations. SHA256SUMS keeps
# listing only the ALP archives and installers: install.sh, install.ps1, `alp update` and the desktop
# app's install flow read it, and none of them needs the DMGs.
name: Release binaries
# Names each run after the SHA it built.
run-name: Release binaries ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Release SHA (a full commit SHA on main)
        required: true

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  check:
    # Only main's copy of this workflow may run: a branch copy could drop the checks below.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: The SHA is a full commit on main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          echo "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "inputs.sha must be a full commit SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo "checked out $(git rev-parse HEAD), not $RELEASE_SHA"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "$RELEASE_SHA is not on main"; exit 1; }
      - id: version
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/binary-build.yml
    with:
      ref: ${{ inputs.sha }}

  # The desktop DMGs, built and tested as CI's desktop-macos job does (ci.yml), from the release SHA.
  desktop:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      # The DMG is named after apps/desktop/package.json's version; it must be the release version.
      - name: The desktop app's version is the release version
        run: |
          desktop=$(node -p "require('./package.json').version")
          test "$desktop" = "$VERSION" || { echo "apps/desktop/package.json is $desktop, the release is $VERSION"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test test
      - run: bun run typecheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: node scripts/build-workspace.mjs cli
        working-directory: .
      # Ad-hoc signing with no certificate, secret or keychain (identity '-'), as in ci.yml. Tripwire:
      # the day this job gets a certificate or Apple notarization credentials, revisit these variables.
      - run: bun run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exactly the two DMGs of this version
        run: |
          ls -l release/*.dmg
          test "$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 2 || { echo "expected exactly two DMGs"; exit 1; }
          for arch in arm64 x64; do
            test -f "release/ALP-$VERSION-$arch.dmg" || { echo "missing ALP-$VERSION-$arch.dmg"; exit 1; }
          done
      # The packaged app as installed from each DMG (e2e/packaged.spec.mjs; x64 under Rosetta), so the
      # DMGs the draft carries are the ones tested.
      - run: ALP_DESKTOP_DMG="release/ALP-$VERSION-arm64.dmg" bun run e2e:packaged
      - run: arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
      - run: ALP_DESKTOP_DMG="release/ALP-$VERSION-x64.dmg" bun run e2e:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-release-desktop
          path: apps/desktop/release/ALP-*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    needs: [check, build, desktop]
    if: github.ref == 'refs/heads/main'
    # The release environment admits deployments from main only (repository setting).
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alp-binary-*
          path: release
          merge-multiple: true
      - name: Archives, install.sh and SHA256SUMS
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            test -f "release/alp-$VERSION-$platform.tar.gz" || { echo "missing alp-$VERSION-$platform.tar.gz"; exit 1; }
          done
          test -f "release/alp-$VERSION-windows-x64.zip" || { echo "missing alp-$VERSION-windows-x64.zip"; exit 1; }
          cp install.sh release/install.sh
          cp install.ps1 release/install.ps1
          node scripts/package-binary.mjs sums release
          ls -l release
      # Added after SHA256SUMS is written, with their own checksum file, so SHA256SUMS stays as before.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alp-release-desktop
          path: desktop
      - name: Desktop DMGs and DESKTOP-SHA256SUMS
        run: |
          for arch in arm64 x64; do
            test -f "desktop/ALP-$VERSION-$arch.dmg" || { echo "missing ALP-$VERSION-$arch.dmg"; exit 1; }
            cp "desktop/ALP-$VERSION-$arch.dmg" release/
          done
          (cd release && sha256sum "ALP-$VERSION-arm64.dmg" "ALP-$VERSION-x64.dmg" > DESKTOP-SHA256SUMS)
          cat release/DESKTOP-SHA256SUMS
          if grep -q '\.dmg' release/SHA256SUMS; then echo "SHA256SUMS must not list a DMG"; exit 1; fi
          ls -l release
      # The release directory attached to the GitHub release (archives, installers, SHA256SUMS): kept
      # as this run's artifact for longer than binary-build's 7 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-release-binaries
          path: release/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/install.sh
            release/install.ps1
            release/*.dmg
      - name: Draft release v${{ needs.check.outputs.version }} (never published here)
        run: |
          tag="v$VERSION"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then echo "release $tag is already published; refusing to touch it"; exit 1; fi
          if [ "$state" = true ]; then
            # A draft has no tag yet; replace it so its target and assets are this SHA's.
            echo "replacing the existing draft $tag"
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          fi
          gh release create "$tag" release/* --draft --prerelease=false --target "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "ALP $VERSION" \
            --notes "Draft binary release built from $RELEASE_SHA by run $GITHUB_RUN_ID. Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh | sh -s -- --version $VERSION (Windows: install.ps1 -Version $VERSION). macOS desktop app: ALP-$VERSION-arm64.dmg or ALP-$VERSION-x64.dmg, ad-hoc signed and not notarized (checksums in DESKTOP-SHA256SUMS; first open: docs/alp/desktop.md section 6.1). Verify provenance: gh attestation verify <archive or dmg> --repo $GITHUB_REPOSITORY --source-ref refs/heads/main --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release-binaries.yml."
          # A normal release (not a prerelease) so install.sh's releases/latest resolves to it once published;
          # npm keeps betas on the beta dist-tag (docs/alp/binary-install.md, version policy).
          release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish,assets \
            --jq '{isDraft, isPrerelease, tagName, targetCommitish, assets: [.assets[].name]}')
          echo "$release"
          test "$(echo "$release" | jq -r .isPrerelease)" = false \
            || { echo "draft $tag is marked as a prerelease"; exit 1; }
