name: Nix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Smoke Nix daemon
        run: |
          set -euo pipefail

          export ALP_HOME
          ALP_HOME="$(mktemp -d)"
          export ALP_LISTEN=127.0.0.1:6767

          WRAPPER_LOG="$ALP_HOME/alp-server-wrapper.log"

          cleanup() {
            if [[ -n "${DAEMON_PID:-}" ]] && kill -0 "$DAEMON_PID" 2>/dev/null; then
              kill "$DAEMON_PID"
              wait "$DAEMON_PID" || true
            fi
            rm -rf "$ALP_HOME"
          }
          trap cleanup EXIT

          ALP_WEB_UI_ENABLED=true ./result/bin/alp-server --no-relay >"$WRAPPER_LOG" 2>&1 &
          DAEMON_PID=$!

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if STATUS_JSON="$(./result/bin/alp daemon status --json)" \
              && jq -e '.connectedDaemon == "reachable"' <<<"$STATUS_JSON" >/dev/null; then
              echo "$STATUS_JSON"
              curl --fail --silent --show-error http://127.0.0.1:6767/ >"$ALP_HOME/web-ui.html"
              [[ -s "$ALP_HOME/web-ui.html" ]]
              exit 0
            fi

            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Nix daemon exited before becoming reachable."
              break
            fi

            sleep 1
          done

          echo "::group::daemon.log"
          cat "$ALP_HOME/daemon.log" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::alp-server stdout/stderr"
          cat "$WRAPPER_LOG" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::alp daemon status"
          ./result/bin/alp daemon status || true
          echo "::endgroup::"

          exit 1

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

  build-desktop-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

      - name: Verify macOS application bundle
        run: |
          set -euo pipefail

          app="result-desktop/Applications/alp.app"
          test -x "$app/Contents/MacOS/Alp"
          test -L result-desktop/bin/alp-desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.anhlp.alp.desktop"
          find "$app" -name Info.plist -print0 | xargs -0 -n 1 plutil -lint
