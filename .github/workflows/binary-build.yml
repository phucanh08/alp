# The ALP executable (t-1e02, docs/alp/binary-install.md): built with `bun build --compile` on a
# native runner per target, smoked there with Node (scripts/binary-smoke.mjs) and without it
# (scripts/binary-smoke-nodeless.sh: debian:bookworm-slim on Linux, `env -i PATH=/usr/bin:/bin` on
# macOS), then packed as alp-<version>-<os>-<arch>.tar.gz. Called by ci.yml and release-binaries.yml.
name: Binary build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default the triggering commit)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: shellcheck --version && shellcheck -s sh install.sh scripts/binary-smoke-nodeless.sh

  binary:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-darwin-arm64, platform: darwin-arm64, runner: macos-14 }
          - { target: bun-darwin-x64, platform: darwin-x64, runner: macos-15-intel }
          - { target: bun-linux-x64, platform: linux-x64, runner: ubuntu-24.04 }
          - { target: bun-linux-arm64, platform: linux-arm64, runner: ubuntu-24.04-arm }
    name: binary (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - name: The runner is the target (native build, no emulation)
        run: |
          bun -e 'const want = process.argv[1]; const have = `${process.platform}-${process.arch}`; if (have !== want) { console.error(`runner is ${have}, target ${want}`); process.exit(1); }' '${{ matrix.platform }}'
      - run: node scripts/build-binary.mjs --target ${{ matrix.target }}
      - name: Size
        run: |
          size=$(wc -c < dist/bin/alp | tr -d ' ')
          echo "alp ${{ matrix.platform }}: $size bytes ($((size / 1048576)) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          file dist/bin/alp
      - name: Smoke (with Node)
        run: node scripts/binary-smoke.mjs dist/bin/alp
      - name: Smoke without Node (debian:bookworm-slim)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist/bin/alp:/opt/alp/alp:ro" -v "$PWD/scripts/binary-smoke-nodeless.sh:/opt/alp/smoke.sh:ro" debian:bookworm-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null && sh /opt/alp/smoke.sh /opt/alp/alp'
      - name: Smoke without Node (env -i PATH=/usr/bin:/bin)
        if: runner.os == 'macOS'
        run: |
          env -i PATH=/usr/bin:/bin sh -c '! command -v node' || { echo "node is in /usr/bin or /bin"; exit 1; }
          env -i PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP" sh scripts/binary-smoke-nodeless.sh dist/bin/alp
      - name: Pack
        run: node scripts/package-binary.mjs pack --binary dist/bin/alp --target ${{ matrix.target }} --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: alp-binary-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          retention-days: 7
          if-no-files-found: error
