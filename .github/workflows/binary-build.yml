# The ALP bundle (t-1807, docs/alp/binary-install.md): ALP's npm install beside the official Node
# release, built by scripts/build-bundle.mjs on a native runner per platform, smoked there with the
# runner's Node driving it (scripts/binary-smoke.mjs, scripts/binary-update-smoke.mjs: install.sh or
# install.ps1, then alp update) and with no system Node at all (scripts/binary-smoke-nodeless.sh:
# debian:bookworm-slim on Linux, `env -i PATH=/usr/bin:/bin` on macOS; scripts/binary-smoke-nodeless.ps1
# with a system-only PATH on Windows), then packed as alp-<version>-<os>-<arch>.tar.gz
# (alp-<version>-windows-x64.zip on Windows). Called by ci.yml and release-binaries.yml.
name: Binary build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default the triggering commit)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: shellcheck --version && shellcheck -s sh install.sh scripts/binary-smoke-nodeless.sh
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($file in 'install.ps1', 'scripts/binary-smoke-nodeless.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${file}: $_" }; exit 1 }
          }

  binary:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, host: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, host: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, host: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, host: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: windows-x64, host: win32-x64, runner: windows-2022 }
    name: binary (${{ matrix.platform }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The runner is the platform (native build and smoke, no emulation)
        run: |
          node -e 'const want = process.argv[1]; const have = `${process.platform}-${process.arch}`; if (have !== want) { console.error(`runner is ${have}, platform ${want}`); process.exit(1); }' '${{ matrix.host }}'
      - run: node scripts/build-bundle.mjs --platform ${{ matrix.platform }}
      - name: Bundle directory
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "BUNDLE=dist/bundle/alp-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"
          echo "LAUNCHER=dist/bundle/alp-$version-${{ matrix.platform }}/bin/${{ runner.os == 'Windows' && 'alp.cmd' || 'alp' }}" >> "$GITHUB_ENV"
      - name: Smoke (driven by the runner's Node)
        run: node scripts/binary-smoke.mjs "$BUNDLE"
      - name: install.sh / install.ps1 and alp update against local file:// and HTTP mirrors
        run: node scripts/binary-update-smoke.mjs "$BUNDLE"
      - name: Smoke without Node (debian:bookworm-slim)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/$BUNDLE:/opt/alp:ro" -v "$PWD/scripts/binary-smoke-nodeless.sh:/opt/smoke.sh:ro" debian:bookworm-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null && sh /opt/smoke.sh /opt/alp/bin/alp'
      - name: Smoke without Node (env -i PATH=/usr/bin:/bin)
        if: runner.os == 'macOS'
        run: |
          env -i PATH=/usr/bin:/bin sh -c '! command -v node' || { echo "node is in /usr/bin or /bin"; exit 1; }
          env -i PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP" sh scripts/binary-smoke-nodeless.sh "$LAUNCHER"
      - name: Smoke without Node (PATH of Windows system directories only)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/binary-smoke-nodeless.ps1 $env:LAUNCHER
      - name: install.ps1 against a local mirror
        if: runner.os == 'Windows'
        run: node --test test/integration/binary-install-ps1.test.js
      - name: Pack
        run: node scripts/package-binary.mjs pack --bundle "$BUNDLE" --out dist/release
      - name: Size
        run: |
          for archive in dist/release/*.tar.gz dist/release/*.zip; do
            [ -f "$archive" ] || continue
            size=$(wc -c < "$archive" | tr -d ' ')
            echo "$(basename "$archive"): $size bytes ($((size / 1048576)) MiB); unpacked $(du -sh "$BUNDLE" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alp-binary-${{ matrix.platform }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          retention-days: 7
          if-no-files-found: error
