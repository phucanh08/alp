# Release acceptance (docs/alp/beta-scope.md §6–§7, decisions D6 and D7). CI is the build machine:
# one run packs the release once at the given SHA (P2–P3, tag created on the runner only, never
# pushed) and keeps the eight tarballs as the artifact every acceptance row uses, macOS included.
# Then, on those exact files and with the repository's fake Codex and fake Claude only (no secrets,
# no cost): release-consumer, CLI C1–C9 per provider, and W6's token gate, on Linux, macOS and
# Windows. Fake runs are rehearsals, never gate evidence: the gate's real-provider rows run on
# macOS by hand (D7). macOS decides this run's result; Linux and Windows are reported, not blocking.
# packs_run reuses the release artifact of an earlier run: never pack the same release twice.
name: Release acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Release SHA (a commit on main)
        required: true
      packs_run:
        description: Run id whose alp-release artifact to reuse instead of packing again
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-acceptance
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.sha }}

jobs:
  pack:
    if: inputs.packs_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: The SHA is on main
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo "inputs.sha must be a full commit SHA"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "$RELEASE_SHA is not on main"; exit 1; }
      - name: Tag on this runner only (P1; the owner pushes the tag at P5)
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || { echo "$tag exists and is not $RELEASE_SHA"; exit 1; }
          else
            git -c user.name="ALP release" -c user.email=release@localhost tag -a "$tag" -m "ALP ${tag#v}" "$RELEASE_SHA"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-app-${{ hashFiles('package-lock.json', 'paseo-web/upstream.json') }}
          restore-keys: npm-web-app-
      - run: npm ci
      - run: npm run build:web
      # The CLI's build includes alp-web (`alp web`): packages/cli/dist/alp-web.js with the private
      # gateway inlined, and the apps/web files in packages/cli/dist/alp-web/ with their notices.
      - run: npm run build:packages
      # release:pack refuses a dirty checkout or an untagged commit, runs prepack, writes SHA256SUMS
      # and release-manifest.json, and runs A5 itself, then checks that @anhlp/alp and @anhlp/alp-cli
      # carry alp-web.js, alp-web/index.html and the notices; verify again against the SHA asked for.
      - run: npm run release:pack -- --out "$RUNNER_TEMP/release/$TAG"
      - run: npm run release:verify -- "$RUNNER_TEMP/release/$TAG" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: alp-release
          path: ${{ runner.temp }}/release/
          retention-days: 90
          if-no-files-found: error

  acceptance:
    needs: pack
    if: ${{ !cancelled() && (needs.pack.result == 'success' || needs.pack.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # D7: macOS is the primary test platform; Linux and Windows are tested when possible.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: alp-release
          path: ${{ runner.temp }}/release
          run-id: ${{ inputs.packs_run || github.run_id }}
          github-token: ${{ github.token }}
      # The harness and release-consumer check SHA256SUMS and the manifest before using the tarballs.
      - name: Locate the release
        run: echo "PACKS=$RUNNER_TEMP/release/v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run release:consumer -- "$PACKS"
      - name: CLI C1–C9, fake Codex
        if: ${{ !cancelled() }}
        run: node scripts/beta-acceptance-cli.mjs --packs "$PACKS" --fake --provider codex --work "$RUNNER_TEMP/alp-beta" --runner "github-actions ${{ github.actor }}"
      - name: CLI C1–C9, fake Claude
        if: ${{ !cancelled() }}
        run: node scripts/beta-acceptance-cli.mjs --packs "$PACKS" --fake --provider claude --work "$RUNNER_TEMP/alp-beta" --runner "github-actions ${{ github.actor }}"
      - name: alp web W6 token gate
        if: ${{ !cancelled() }}
        run: node scripts/beta-acceptance-web.mjs --packs "$PACKS" --fake --work "$RUNNER_TEMP/alp-beta" --runner "github-actions ${{ github.actor }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: acceptance-fake-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/alp-beta/results-*.json
            ${{ runner.temp }}/alp-beta/logs/
            ${{ runner.temp }}/alp-beta/*/home/logs/
          retention-days: 30
