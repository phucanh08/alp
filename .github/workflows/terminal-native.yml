name: Terminal native helpers

# Rebuilds the four Linux terminal-owner helpers from this exact revision and checks the COMMITTED
# prebuilts against it (t-08cf): the committed manifest must record the same terminal-owner.c hash
# as the fresh build, and the committed binary must match its manifest and pass the same capability
# checks. Builds are not byte-reproducible, so binary hashes are not compared across builds.
# CI consumers and releases use the committed binaries; the uploaded fresh builds are what a
# developer commits after changing terminal-owner.c (packages/daemon/native/README.md).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc slots build on the documented glibc 2.28 floor (AlmaLinux 8 based manylinux_2_28).
          - slot: linux-x64-glibc
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - slot: linux-arm64-glibc
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - slot: linux-x64-musl
            runner: ubuntu-24.04
            image: alpine:3.20
          - slot: linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.20
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build and execute ${{ matrix.slot }}
        env:
          IMAGE: ${{ matrix.image }}
          SLOT: ${{ matrix.slot }}
        run: |
          committed="$RUNNER_TEMP/committed"
          mkdir -p "$committed"
          # Keep the committed slot aside; a missing one fails the check step after the fresh upload.
          if [ -d "packages/daemon/native/prebuilt/$SLOT" ]; then cp -a "packages/daemon/native/prebuilt/$SLOT" "$committed/"; fi
          case "$SLOT" in
            *-glibc)
              # The runner's official Node binary supports glibc 2.28, so it runs inside the floor image.
              docker run --rm -v "$PWD:/w" -v "$(dirname "$(dirname "$(command -v node)")"):/opt/hostnode:ro" -w /w "$IMAGE" \
                sh -ec 'cc --version; ldd --version | head -1; /opt/hostnode/bin/node scripts/build-terminal-native.mjs' ;;
            *-musl)
              docker run --rm -v "$PWD:/w" -w /w "$IMAGE" \
                sh -ec 'apk add --no-cache build-base linux-headers nodejs >/dev/null; cc --version; node scripts/build-terminal-native.mjs' ;;
          esac
          sudo chown -R "$(id -u):$(id -g)" packages/daemon/native/prebuilt
          dir="packages/daemon/native/prebuilt/$SLOT"
          test -x "$dir/terminal-owner"
          grep -q "\"slot\": \"$SLOT\"" "$dir/manifest.json"
          cat "$dir/manifest.json"
          # Non-root execution in the slot's own libc (the musl loader is absent on the runner host).
          full=alp-terminal-owner:1
          test "$(docker run --rm --user 1001:1001 -v "$PWD:/w:ro" -w /w "$IMAGE" "$dir/terminal-owner" --capability)" = "$full"
          case "$SLOT" in *-glibc)
            # Non-root on the real host (cannot read /proc/1/ns/pid).
            test "$("$dir/terminal-owner" --capability)" = "$full"
            # Own PID namespace with its own procfs: full protection.
            test "$(sudo unshare --pid --fork --mount-proc "$dir/terminal-owner" --capability)" = "$full"
            # A new PID namespace still seeing the ancestor procfs must lose full protection
            # and offer only root-only compatibility.
            test "$(sudo unshare --pid --fork "$dir/terminal-owner" --capability)" = "$full:root-only" ;;
          esac
          # Package the FRESH build (what a developer commits after a source change). tar preserves the
          # executable bit that upload-artifact drops.
          tar -C packages/daemon/native/prebuilt -cf "$RUNNER_TEMP/$SLOT.tar" "$SLOT"
          echo "FRESH_SOURCE=$(node -p "require('./$dir/manifest.json').source")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-native-${{ matrix.slot }}
          path: ${{ runner.temp }}/${{ matrix.slot }}.tar
          retention-days: 7
          if-no-files-found: error
      - name: Committed ${{ matrix.slot }} matches this source and executes
        env:
          IMAGE: ${{ matrix.image }}
          SLOT: ${{ matrix.slot }}
        run: |
          dir="packages/daemon/native/prebuilt/$SLOT"
          full=alp-terminal-owner:1
          test -d "$RUNNER_TEMP/committed/$SLOT" || { echo "::error::No committed prebuilt for $SLOT"; exit 1; }
          rm -rf "$dir" && cp -a "$RUNNER_TEMP/committed/$SLOT" "$dir"
          git diff --exit-code -- packages/daemon/native/prebuilt
          test "$(node -p "require('./$dir/manifest.json').source")" = "$FRESH_SOURCE" || { echo "::error::Committed $SLOT prebuilt is stale: rebuild all six slots (packages/daemon/native/README.md)"; exit 1; }
          test "$(sha256sum "$dir/terminal-owner" | cut -d' ' -f1)" = "$(node -p "require('./$dir/manifest.json').sha256")"
          test "$(node -p "require('./$dir/manifest.json').slot")" = "$SLOT"
          test "$(node -p "require('./$dir/manifest.json').protocol")" = 1
          test -x "$dir/terminal-owner"
          test "$(docker run --rm --user 1001:1001 -v "$PWD:/w:ro" -w /w "$IMAGE" "$dir/terminal-owner" --capability)" = "$full"
          case "$SLOT" in *-glibc)
            test "$("$dir/terminal-owner" --capability)" = "$full"
            test "$(sudo unshare --pid --fork --mount-proc "$dir/terminal-owner" --capability)" = "$full"
            test "$(sudo unshare --pid --fork "$dir/terminal-owner" --capability)" = "$full:root-only" ;;
          esac
